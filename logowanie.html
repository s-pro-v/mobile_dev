<!DOCTYPE html>
<html lang="pl" theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet" />
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg' fill='none' stroke-linecap='square' stroke-linejoin='miter'%3E%3Cpolygon points='35,15 85,15 85,105 35,105' stroke='%23292929' stroke-width='6'/%3E%3Cpolygon points='45,30 75,30 75,70 45,70' stroke='%23949494' stroke-width='4'/%3E%3Crect x='50' y='40' width='6' height='6' fill='%23f36c00' stroke='none'/%3E%3Crect x='64' y='40' width='6' height='6' fill='%23f36c00' stroke='none'/%3E%3Crect x='50' y='54' width='6' height='6' fill='%23dbdbdb' stroke='none'/%3E%3Crect x='64' y='54' width='6' height='6' fill='%23f36c00' stroke='none'/%3E%3Crect x='55' y='85' width='10' height='10' stroke='%23292929' stroke-width='4'/%3E%3Cpolyline points='20,40 10,50 20,60' stroke='%23f36c00' stroke-width='4'/%3E%3Cpolyline points='100,40 110,50 100,60' stroke='%23f36c00' stroke-width='4'/%3E%3Cpolyline points='25,30 15,50 25,70' stroke='%23949494' stroke-width='2'/%3E%3Cpolyline points='95,30 105,50 95,70' stroke='%23949494' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>SYS.AUTH // Push Approval Protocol</title>
    <link rel="stylesheet" href="css/logowanie.css">
</head>

<body>

    <div class="sys-terminal">
        <header class="sys-header">
            <div class="sys-brand">
                <span class="sys-id">SYS.AUTH</span>
                <span class="sys-kernel">KERNEL v3.11</span>
            </div>
            <div class="sys-controls">
                <button type="button" class="ctrl-btn" id="reset-cache-btn" title="Resetuj pamięć podręczną">
                    <i class="fas fa-trash-can"></i>
                </button>
                <button type="button" class="ctrl-btn" id="theme-btn">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- KROK 1 -->
        <main class="auth-core" id="step-1">
            <h1>
                <span class="sys-login">Logowanie</span>
                <span class="sys-2fa">2FA</span>
            </h1>
            <p>Wprowadź Name i Password. Wymagane autoryzowanie PUSH.</p>
            <input type="text" id="sys-user" class="credential-input" placeholder="NAME (Login)" autocomplete="off">
            <input type="password" id="sys-pass" class="credential-input" placeholder="PASSWORD">
            <button class="trigger-btn" id="login-trigger" disabled>
                <i class="fas fa-right-to-bracket"></i> Inicjalizacja środowiska...
            </button>
        </main>

        <!-- KROK 2 (AUTO PUSH WAIT) -->
        <main class="auth-core hidden-step" id="step-2">
            <h1>Autoryzacja PUSH</h1>
            <p>Nasłuchiwanie na zezwolenie administratora dla węzła:
                <span id="current-user-display" class="highlight-text"></span>
            </p>

            <div class="token-matrix" id="token-container">
                <input type="number" class="crypt-input" readonly><input type="number" class="crypt-input"
                    readonly><input type="number" class="crypt-input" readonly>
                <input type="number" class="crypt-input" readonly><input type="number" class="crypt-input"
                    readonly><input type="number" class="crypt-input" readonly>
            </div>

            <button class="trigger-btn" id="auth-trigger" disabled>
                <span class="loader" id="wait-spinner"></span>
                <i class="fas fa-fingerprint"></i> Oczekiwanie na sygnał...
            </button>

            <div class="aux-links">
                <a href="#" id="cancel-trigger"><i class="fas fa-xmark"></i> Przerwij żądanie</a>
                <a href="mobile/index.html" id="link-mobile-panel" class="hidden"><i class="fas fa-mobile-screen"></i>
                    Panel
                    mobilny</a>
                <a href="admin.html" id="link-admin-panel" class="hidden"><i class="fas fa-user-shield"></i> Panel
                    administratora</a>
            </div>
        </main>

        <div class="status-console" id="status-log">[SYSTEM] Oczekiwanie na definicję klucza API...</div>
    </div>

    <script src="js/logowanie.js"></script>
</body>

</html>
